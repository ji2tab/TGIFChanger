# TGIFChanger 設定ファイル (v2.3.5)
#
# Bash KEY=VALUE 形式。両方の環境で読み込み可能:
#   sudo bash install.sh     (インストール)
#   tg_change --status       (ステータス確認)
#   sudo tg_change -w 168    (設定変更)
#
# 【設定の反映について】
# tg_change コマンドを使って変更した場合は、デーモンに即時反映されます。
# nano 等でこのファイルを直接手動編集した場合のみ、以下のコマンドで再起動してください:
# sudo systemctl restart tgifchanger-py

LOG_DIR="/var/log/pi-star"
WATCH_SLOT="2"
RESTORE_SLOT="2"

# --- 監視TG / 復帰TG ---
#
# 【TGIF 直結 (従来の使い方)】
#   WATCH_TG   = 無線機で使うホーム TG (DMRGateway の TGRewrite で TGIF の TG に書き換える側)
#   RESTORE_TG = 一定時間後に戻る TGIF の TG
#   例: WATCH_TG="1" / RESTORE_TG="168"
#
# 【XLX 基準接続 (v2.3.5)】 待機は XLX、TGIF は必要なときだけ接続する使い方
#   DMRGateway の [XLX Network] を有効 (Enabled=1) にした構成で使う。
#   WATCH_TG   = DMRGateway [XLX Network] の TG と同じ値 (この TG の通話は XLX とやりとりされる)
#   RESTORE_TG = "4000" (TGIF を切断して、XLX だけの待機に戻る)
#   例: WATCH_TG="6" / RESTORE_TG="4000"
#   ※ DMRGateway 側の設定 (待機 TG を TGIF へ書き換える規則の削除など) も必要です。
#     詳しくは XLX_Base_Mode.md を参照してください。
#
WATCH_TG="1"
RESTORE_TG="168"

# 他 TG の通話が終わってから RESTORE_TG へ復帰するまでの秒数
RESTORE_DELAY="120"

# --- コールサイン監視 (真の利用者ウォッチドッグ) ---
#
# 他TGへ "RF(自局側)キーアップ" した最後の局を「真の利用者」として記録し、
# その局のRFが CALLSIGN_TIMEOUT 秒だけ確認できなければ、ネット側(リモート)の
# 通話が続いていても RESTORE_TG へ強制復帰します。
#   - network 受信(リモート通話)はカウント対象外
#   - 別の局がRFキーアップすると、追跡対象をその局へ切り替える
#   - "0" を指定するとこの機能は無効 (従来の RESTORE_DELAY のみで動作)
#
CALLSIGN_TIMEOUT="300"

GPIO_PIN="17"

# --- GPIO Backend (ハイブリッド対応) ---
# 
# GPIO_BACKEND:
#   "auto"     (デフォルト)
#              → pinctrl / raspi-gpio / sysfs を順に試す
#              → Pi-Star(Buster) on Pi Zero 2W で動作実績あり
#   "libgpiod"
#              → libgpiod v1/v2 を使用
#              → Bookworm / Pi5 環境に推奨 (仕様書§6)
#              → gpiodetect で gpiochip を自動判定
#   "pinctrl", "raspi-gpio", "sysfs", "null"
#              → 強制指定
#
GPIO_BACKEND="auto"

# GPIO_CHIP (libgpiod使用時のみ有効):
#   "auto"     (デフォルト) → gpiodetect で BCM チップを探す
#                            Pi4以前: gpiochip0
#                            Pi5:    gpiochip4
#   "0", "4"   → explicit chip number
#   "gpiochip0", "gpiochip4" → chip name
#
GPIO_CHIP="auto"

# --- TGIF API ---
TGIF_API="http://tgif.network:5040/api/sessions/update"
TGIF_API_TIMEOUT="10"
