# =============================================================================
# TGIFChanger 共通設定ファイル
# Path: /etc/tgifchanger.conf
# Version: v1.2.2
# =============================================================================

# --- MMDVMHost ログ設定 ---
LOG_DIR="/var/log/pi-star"

# --- 対象スロット設定 ---
WATCH_SLOT="2"
RESTORE_SLOT="2"

# --- GPIO設定 (Bookworm/Pi-Star 4.3.x / WPSD 用) ---
GPIO_PIN="17"
GPIO_BACKEND="auto"
GPIO_CHIP="0"

# --- 自動復帰設定 ---
RESTORE_DELAY="120"

# --- TGIF API 設定 ---
TGIF_API="http://tgif.network:5040/api/sessions/update"
TGIF_API_TIMEOUT="10"

# =============================================================================
# ※ WATCH_TG（監視TG）および RESTORE_TG（復帰先TG）について
# v1.2.1以降、これらの値は /etc/mmdvmhost の「tgif.network」セクション
# (TGRewrite) から動的に自動取得されるため、ここでの指定は不要です。
# =============================================================================
