# =============================================================================
# TGIFChanger 共通設定ファイル (Prototype)
# Path: /etc/tgifchanger.conf
# -----------------------------------------------------------------------------
# 本ファイルは tg_change / auto_tg_restore / log_monitor の3スクリプトから
# 共通で読み込まれます。値の変更後はサービス再起動が必要です:
#   sudo systemctl restart log_monitor auto_tg_restore
# =============================================================================

# --- MMDVMHost ログ設定 ----------------------------------------------------
# Pi-Star/WPSD のログディレクトリ
LOG_DIR="/var/log/pi-star"

# --- DMR スロット監視設定 --------------------------------------------------
# auto_tg_restore / log_monitor が監視する DMR スロット (1 or 2)
WATCH_SLOT="2"

# --- 自動復帰 (auto_tg_restore) 設定 ---------------------------------------
# 通信終了から復帰までの待機時間 (秒)
RESTORE_DELAY="120"

# 復帰先の TG (ホーム TG)
RESTORE_TG="168"

# 復帰先のスロット (通常は WATCH_SLOT と同じ)
RESTORE_SLOT="2"

# --- GPIO ブリッジ (log_monitor) 設定 -------------------------------------
# 受信検出対象 TG (例: TG1 = ワールドワイド)
# このTGを受信中はGPIOがHIGHになります
WATCH_TG="1"

# 出力 GPIO 番号 (BCM 番号、物理ピン番号ではない)
# GPIO17 = 物理ピン11
GPIO_PIN="17"

# GPIO バックエンド: "auto" / "libgpiod" / "sysfs"
# auto: libgpiod があればそちらを使用、無ければ sysfs にフォールバック
GPIO_BACKEND="auto"

# libgpiod 使用時の chip 名 (Pi 4以前: gpiochip0 / Pi 5: gpiochip4)
# "auto" 指定で自動検出
GPIO_CHIP="auto"

# --- TGIF API 設定 ---------------------------------------------------------
# 通常は変更不要
TGIF_API="http://tgif.network:5040/api/sessions/update"
TGIF_API_TIMEOUT="10"
