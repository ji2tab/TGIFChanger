# =============================================================================
# TGIFChanger 共通設定ファイル
# Path: /etc/tgifchanger.conf
# Version: v1.2.4
# =============================================================================

# --- MMDVMHost ログ設定 ---
LOG_DIR="/var/log/pi-star"

# --- 対象スロット設定 ---
WATCH_SLOT="2"
RESTORE_SLOT="2"

# --- GPIO設定 (Bookworm/Pi-Star 4.3.x / WPSD 用) ---
GPIO_PIN="17"
GPIO_CHIP="0"

# --- 自動復帰設定 ---
RESTORE_DELAY="120"

# --- TGIF API 設定 ---
TGIF_API="http://tgif.network:5040/api/sessions/update"
TGIF_API_TIMEOUT="10"

# =============================================================================
# ※ WATCH_TG（監視TG）および RESTORE_TG（復帰先TG）の指定について (v1.2.4〜)
# 
# 基本的に /etc/mmdvmhost から自動取得を試みますが、WPSD環境などで
# うまく取得できない場合や、意図的に特定のTGへ固定したい場合は、
# 以下の変数のコメントアウト(#)を外し、値を明記してください。
# ここに値が設定されている場合、システムはこの値を【最優先】で適用します。
# =============================================================================

# WATCH_TG="168"
# RESTORE_TG="168"
