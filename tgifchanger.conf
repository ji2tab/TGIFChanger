# =============================================================================
# TGIFChanger 共通設定ファイル (Optimized for .sh scripts)
# Path: /etc/tgifchanger.conf
# -----------------------------------------------------------------------------
# 本ファイルは tg_change.sh / auto_tg_restore.sh / log_monitor.sh の
# 3スクリプトから共通で読み込まれます。
# 値の変更後は、以下のコマンドでサービスを再起動してください:
#   sudo systemctl restart log_monitor auto_tg_restore
# =============================================================================

# --- MMDVMHost ログ設定 ----------------------------------------------------
# Pi-Star/WPSD のログディレクトリ (通常は変更不要)
LOG_DIR="/var/log/pi-star"

# --- DMR スロット監視設定 --------------------------------------------------
# auto_tg_restore.sh / log_monitor.sh が監視する DMR スロット (1 or 2)
WATCH_SLOT="2"

# --- 自動復帰 (auto_tg_restore.sh) 設定 ------------------------------------
# 通信終了から復帰までの待機時間 (秒)
RESTORE_DELAY="120"

# 復帰先の TG (ホーム TG)
RESTORE_TG="168"

# 復帰先のスロット (通常は WATCH_SLOT と同じ)
RESTORE_SLOT="2"

# --- GPIO ブリッジ (log_monitor.sh) 設定 -----------------------------------
# 受信検出対象 TG (例: TG1 = ワールドワイド)
# このTGを受信中はGPIOがHIGHになります。
WATCH_TG="1"

# 出力 GPIO 番号 (BCM 番号。物理ピン番号ではないことに注意)
# GPIO17 = 物理ピン11番
GPIO_PIN="17"

# GPIO バックエンド: "auto" / "libgpiod" / "sysfs"
# auto: libgpiod があれば優先使用、なければ sysfs にフォールバックします
GPIO_BACKEND="auto"

# libgpiod 使用時の chip 名 (通常は "auto" で自動検出されます)
# Raspberry Pi 4以前: gpiochip0 / Raspberry Pi 5: gpiochip4 など
GPIO_CHIP="auto"

# --- TGIF API 設定 ---------------------------------------------------------
# 通常は変更不要
TGIF_API="http://tgif.network:5040/api/sessions/update"
TGIF_API_TIMEOUT="10"