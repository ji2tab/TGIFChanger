# =============================================================================
# TGIFChanger 共通設定ファイル
# Path: /etc/tgifchanger.conf
# =============================================================================

# --- MMDVMHost ログ設定 ---
LOG_DIR="/var/log/pi-star"
WATCH_SLOT="2"

# --- GPIO設定 (WPSD/Bookworm/Pi-Star 4.3.x 用) ---
GPIO_PIN="17"
GPIO_BACKEND="libgpiod"
GPIO_CHIP="0"

# --- 自動復帰設定 ---
RESTORE_DELAY="120"
RESTORE_SLOT="2"

# --- TGIF API 設定 (tg_change.sh用) ---
TGIF_API="http://tgif.network:5040/api/sessions/update"
TGIF_API_TIMEOUT="10"
